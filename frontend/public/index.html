<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compose Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181c24;
      --border: #1e2330;
      --accent: #00e5a0;
      --accent-dim: rgba(0,229,160,0.12);
      --accent-glow: rgba(0,229,160,0.35);
      --danger: #ff4d6a;
      --danger-dim: rgba(255,77,106,0.12);
      --danger-glow: rgba(255,77,106,0.3);
      --text: #e8eaf0;
      --text-muted: #5a6070;
      --text-mid: #8892a4;
      --running: #00e5a0;
      --stopped: #ff4d6a;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* Header */
    header {
      padding: 32px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-text span { color: var(--accent); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .vm-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-mid);
    }

    .vm-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      color: var(--text-mid);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      flex: 1;
      min-width: 140px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-value.green { color: var(--accent); }
    .stat-value.red { color: var(--danger); }
    .stat-value.white { color: var(--text); }

    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Search */
    .search-bar {
      margin-bottom: 24px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* Project grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .project-card:hover { border-color: #2a3040; transform: translateY(-2px); }
    .project-card.running { border-color: rgba(0,229,160,0.25); }
    .project-card.running:hover { border-color: rgba(0,229,160,0.5); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .project-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .status-badge.running {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(0,229,160,0.3);
    }

    .status-badge.stopped {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(255,77,106,0.3);
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .running .status-dot { box-shadow: 0 0 4px currentColor; animation: pulse 2s infinite; }

    .project-path {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ports-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 11px;
      line-height: 1.6;
    }

    .ports-title {
      color: var(--text-mid);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .port-line {
      color: var(--text);
      word-break: break-word;
    }

    .port-line .svc {
      color: var(--accent);
      margin-right: 6px;
    }

    .port-line.conflict {
      color: var(--danger);
    }

    .conflict-note {
      margin-top: 6px;
      color: var(--danger);
      font-size: 10px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-up {
      background: var(--accent-dim);
      border-color: rgba(0,229,160,0.3);
      color: var(--accent);
    }

    .btn-up:hover:not(:disabled) {
      background: rgba(0,229,160,0.2);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-down {
      background: var(--danger-dim);
      border-color: rgba(255,77,106,0.3);
      color: var(--danger);
    }

    .btn-down:hover:not(:disabled) {
      background: rgba(255,77,106,0.2);
      border-color: var(--danger);
      box-shadow: 0 0 12px var(--danger-glow);
    }

    .btn-logs {
      flex: 0;
      padding: 10px 12px;
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text-muted);
    }

    .btn-logs:hover:not(:disabled) {
      border-color: var(--text-mid);
      color: var(--text);
    }

    .btn .spinner {
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }

    /* Log drawer */
    .log-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      height: 320px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .log-drawer.open { transform: translateY(0); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .drawer-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-project { color: var(--accent); }

    .drawer-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s;
      font-family: var(--font-mono);
    }

    .drawer-close:hover { color: var(--text); }

    .log-output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      font-size: 12px;
      line-height: 1.7;
    }

    .log-line { color: var(--text-mid); }
    .log-line.success { color: var(--accent); }
    .log-line.error { color: var(--danger); }
    .log-line.info { color: #7eb8ff; }

    .log-line::before {
      content: '> ';
      color: var(--text-muted);
    }

    /* Empty / loading states */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-family: var(--font-display); font-size: 18px; color: var(--text-mid); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; }

    .loading-state {
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error-banner {
      background: var(--danger-dim);
      border: 1px solid rgba(255,77,106,0.3);
      border-radius: 8px;
      padding: 16px 20px;
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
      max-width: 320px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .toast.success { border-color: rgba(0,229,160,0.4); color: var(--accent); }
    .toast.error { border-color: rgba(255,77,106,0.4); color: var(--danger); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a3040; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">Compose <span>Manager</span></div>
      </div>
      <div class="header-meta">
        <div class="vm-badge">
          <span class="dot"></span>
          <span id="vm-host-display">connecting…</span>
        </div>
        <button class="refresh-btn" onclick="loadProjects()" id="refresh-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <div class="stats-bar" id="stats-bar" style="display:none">
    <div class="stat">
      <div class="stat-value white" id="stat-total">0</div>
      <div class="stat-label">Total Projects</div>
    </div>
    <div class="stat">
      <div class="stat-value green" id="stat-running">0</div>
      <div class="stat-label">Running</div>
    </div>
    <div class="stat">
      <div class="stat-value red" id="stat-stopped">0</div>
      <div class="stat-label">Stopped</div>
    </div>
  </div>

  <div class="search-bar" id="search-wrap" style="display:none">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Filter projects…" oninput="filterProjects()" />
  </div>

  <div id="error-banner" class="error-banner" style="display:none"></div>
  <div id="loading" class="loading-state"><div class="loading-spinner"></div> Discovering projects on VM…</div>
  <div id="projects-grid" class="projects-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <div class="icon">📭</div>
    <h3>No projects found</h3>
    <p>No docker-compose files discovered in <code id="base-dir-display"></code></p>
  </div>
</div>

<!-- Log drawer -->
<div class="log-drawer" id="log-drawer">
  <div class="drawer-header">
    <div class="drawer-title">
      <span>Terminal</span>
      <span>—</span>
      <span class="drawer-project" id="drawer-project-name"></span>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="log-output" id="log-output"></div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script>
  let allProjects = [];

  async function loadProjects() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('projects-grid').innerHTML = '';
    document.getElementById('error-banner').style.display = 'none';
    document.getElementById('stats-bar').style.display = 'none';
    document.getElementById('search-wrap').style.display = 'none';
    document.getElementById('empty-state').style.display = 'none';

    try {
      const res = await fetch('/api/projects');
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Failed to fetch projects');

      allProjects = data.projects || [];
      renderProjects(allProjects);
    } catch (err) {
      document.getElementById('error-banner').textContent = '❌ ' + err.message;
      document.getElementById('error-banner').style.display = 'block';
    } finally {
      document.getElementById('loading').style.display = 'none';
      btn.classList.remove('spinning');
    }
  }

  function renderProjects(projects) {
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = '';

    const running = projects.filter(p => p.running).length;
    const stopped = projects.length - running;

    document.getElementById('stat-total').textContent = projects.length;
    document.getElementById('stat-running').textContent = running;
    document.getElementById('stat-stopped').textContent = stopped;

    if (projects.length > 0) {
      document.getElementById('stats-bar').style.display = 'flex';
      document.getElementById('search-wrap').style.display = 'block';
    }

    if (projects.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    projects.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = `project-card ${p.running ? 'running' : ''}`;
      card.style.animationDelay = `${i * 40}ms`;
      card.dataset.name = p.name.toLowerCase();
      card.dataset.dir = p.dir;

      const serviceInfo = p.serviceCount > 0
        ? `${p.runningCount}/${p.serviceCount} services`
        : '';

      const ports = Array.isArray(p.ports) ? p.ports : [];
      const portLines = ports.length
        ? ports
            .map((m) => {
              const proto = (m.protocol || 'tcp').toLowerCase();
              const hostIp = m.hostIp ? `${escHtml(m.hostIp)}:` : '';
              const key = `${m.hostPort}/${proto}`;
              const isConflict = Array.isArray(p.conflicts)
                ? p.conflicts.some(c => `${c.hostPort}/${(c.protocol || 'tcp').toLowerCase()}` === key)
                : false;
              return `<div class="port-line ${isConflict ? 'conflict' : ''}"><span class="svc">${escHtml(m.service)}</span>${hostIp}${escHtml(m.hostPort)} -> ${escHtml(m.containerPort)}/${escHtml(proto)}</div>`;
            })
            .join('')
        : '<div class="port-line">No published host ports</div>';

      const conflictCount = Array.isArray(p.conflicts) ? p.conflicts.length : 0;
      const conflictNote = conflictCount > 0
        ? `<div class="conflict-note">Conflict detected on ${conflictCount} mapping(s)</div>`
        : '';

      card.innerHTML = `
        <div class="card-header">
          <div class="project-name">${escHtml(p.name)}</div>
          <div class="status-badge ${p.running ? 'running' : 'stopped'}">
            <div class="status-dot"></div>
            ${p.running ? 'Running' : 'Stopped'}
          </div>
        </div>
        <div class="project-path" title="${escHtml(p.dir)}">${escHtml(p.dir)}${serviceInfo ? ` · ${serviceInfo}` : ''}</div>
        <div class="ports-block">
          <div class="ports-title">Host Port Usage</div>
          ${portLines}
          ${conflictNote}
        </div>
        <div class="card-actions">
          <button class="btn btn-up" onclick="runAction('up', '${escAttr(p.dir)}', '${escAttr(p.name)}', this)" ${p.running ? 'disabled' : ''}>
            <span class="btn-text">▶ Up</span>
            <div class="spinner"></div>
          </button>
          <button class="btn btn-down" onclick="runAction('down', '${escAttr(p.dir)}', '${escAttr(p.name)}', this)" ${!p.running ? 'disabled' : ''}>
            <span class="btn-text">■ Down</span>
            <div class="spinner"></div>
          </button>
          <button class="btn btn-logs" title="View logs" onclick="viewLogs('${escAttr(p.dir)}', '${escAttr(p.name)}', this)">
            <span class="btn-text">≡</span>
            <div class="spinner"></div>
          </button>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function filterProjects() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allProjects.filter(p =>
      p.name.toLowerCase().includes(q) || p.dir.toLowerCase().includes(q)
    );
    renderProjects(filtered);
  }

  async function runAction(action, dir, name, btn) {
    openDrawer(name);
    clearLog();
    addLog(`Starting compose ${action} for ${name}…`, 'info');

    // Disable all buttons on this card
    const card = btn.closest('.project-card');
    const btns = card.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);
    btn.classList.add('loading');

    try {
      const res = await fetch(`/api/projects/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const evt = JSON.parse(line.slice(6));
              if (evt.type === 'log') addLog(evt.text);
              if (evt.type === 'done') {
                addLog(evt.text, evt.success ? 'success' : 'error');
                showToast(evt.success ? `✅ ${name}: compose ${action} done` : `❌ ${name}: failed`, evt.success ? 'success' : 'error');
              }
            } catch {}
          }
        }
      }

      // Reload just this card's status
      await loadProjects();
    } catch (err) {
      addLog('❌ ' + err.message, 'error');
      showToast('Connection error', 'error');
    } finally {
      btn.classList.remove('loading');
    }
  }

  async function viewLogs(dir, name, btn) {
    openDrawer(name);
    clearLog();
    addLog(`Fetching logs for ${name}…`, 'info');
    btn.classList.add('loading');

    try {
      const res = await fetch(`/api/projects/logs?dir=${encodeURIComponent(dir)}`);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const evt = JSON.parse(line.slice(6));
              if (evt.type === 'log') addLog(evt.text);
            } catch {}
          }
        }
      }
    } catch (err) {
      addLog('❌ ' + err.message, 'error');
    } finally {
      btn.classList.remove('loading');
    }
  }

  // Drawer
  function openDrawer(name) {
    document.getElementById('drawer-project-name').textContent = name;
    document.getElementById('log-drawer').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('log-drawer').classList.remove('open');
  }

  function clearLog() {
    document.getElementById('log-output').innerHTML = '';
  }

  function addLog(text, type = '') {
    const out = document.getElementById('log-output');
    const line = document.createElement('div');
    line.className = `log-line ${type}`;
    line.textContent = text;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  // Toast
  function showToast(msg, type = '') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  // Helpers
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s).replace(/'/g, "\\'");
  }

  // Init
  document.getElementById('vm-host-display').textContent = window.location.hostname !== 'localhost'
    ? window.location.hostname : 'VM via SSH';
  loadProjects();
</script>
</body>

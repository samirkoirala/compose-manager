name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: samirkoirala/compose-manager

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Calculate next release tag
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

          if [[ -z "$latest_tag" ]]; then
            current_version=1
          else
            current_version=${latest_tag#v}
          fi

          if ! [[ "$current_version" =~ ^[0-9]+$ ]]; then
            current_version=1
          fi

          next_version=$((current_version + 1))
          release_tag="v${next_version}"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version_number=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.release_tag }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Compose Manager
            org.opencontainers.image.description=Remote Docker Compose manager over SSH
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish git tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${{ steps.version.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Tag already exists locally."
            exit 0
          fi

          git tag "${{ steps.version.outputs.release_tag }}"
          git push origin "${{ steps.version.outputs.release_tag }}"